name: Bug — English
description: Report unexpected SoundLeaf behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Do not attach audio, participant names, personal paths or raw logs. Share only redacted error details.'
  - type: input
    id: version
    attributes:
      label: SoundLeaf and Windows version
      placeholder: 'SoundLeaf 3.0.5; Windows 11; x64; 150% DPI'
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Recording profile
      options:
        - mkv / aac
        - ogg / opus
        - mp3
        - m4a / aac
        - aac / adts
        - WAV-only
        - Not recording
  - type: textarea
    id: setup
    attributes:
      label: Installation method, FFmpeg version and failure stage
      description: Online Setup or portable; encoder present or missing; capture, pause, saving or conversion. Redact personal paths.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
