name: Bug — English
description: Report unexpected SoundLeaf behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Do not attach audio, participant names, personal paths or raw logs. Share only redacted error details.'
  - type: input
    id: version
    attributes:
      label: SoundLeaf and Windows version
      placeholder: 'SoundLeaf 3.0.4; Windows 11; x64; 150% DPI'
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile / Profil / Профиль
      options:
        - mkv / aac
        - ogg / opus
        - mp3
        - m4a / aac
        - aac / adts
        - WAV-only
        - Not recording / Keine Aufnahme / Без записи
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
