name: Fehler — Deutsch
description: Fehler oder unerwartetes Verhalten von SoundLeaf.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Keine Audiodateien, Teilnehmernamen, persönlichen Pfade oder unbearbeiteten Protokolle anhängen. Nur bereinigte Fehlermeldungen teilen.'
  - type: input
    id: version
    attributes:
      label: SoundLeaf- und Windows-Version
      placeholder: 'SoundLeaf 3.0.4; Windows 11; x64; 150% DPI'
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Aufnahmeprofil
      options:
        - mkv / aac
        - ogg / opus
        - mp3
        - m4a / aac
        - aac / adts
        - Nur WAV
        - Keine Aufnahme
  - type: textarea
    id: setup
    attributes:
      label: Installation, FFmpeg-Version und Fehlerschritt
      description: Online-Setup oder Portable; Encoder vorhanden oder fehlend; Aufnahme, Pause, Speicherung oder Konvertierung. Persönliche Pfade entfernen.
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Wiederholung
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Erwartetes und tatsächliches Verhalten
    validations:
      required: true
